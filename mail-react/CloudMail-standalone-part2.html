function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', noDeckControls = false, children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const hasDeckStage = React.useMemo(
    () => typeof document !== 'undefined' && !!document.querySelector('deck-stage'),
    [],
  );
  const [railEnabled, setRailEnabled] = React.useState(
    () => hasDeckStage && !!document.querySelector('deck-stage')?._railEnabled,
  );
  React.useEffect(() => {
    if (!hasDeckStage || railEnabled) return undefined;
    const onMsg = (e) => {
      if (e.data && e.data.type === '__omelette_rail_enabled') setRailEnabled(true);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [hasDeckStage, railEnabled]);
  const [railVisible, setRailVisible] = React.useState(() => {
    try { return localStorage.getItem('deck-stage.railVisible') !== '0'; } catch (e) { return true; }
  });
  const toggleRail = (on) => {
    setRailVisible(on);
    window.postMessage({ type: '__deck_rail_visible', on }, '*');
  };
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
          {hasDeckStage && railEnabled && !noDeckControls && (
            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />
            </TweakSection>
          )}
        </div>
      </div>
    </>
  );
}

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});
</script>

function Icon({ name, size = 18, stroke = 1.6 }) {
  const props = {
    width: size, height: size, viewBox: '0 0 24 24',
    fill: 'none', stroke: 'currentColor',
    strokeWidth: stroke, strokeLinecap: 'round', strokeLinejoin: 'round',
  };
  switch (name) {
    case 'inbox':    return <svg {...props}><path d="M3 13l3-8h12l3 8v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-6z"/><path d="M3 13h5l1 2h6l1-2h5"/></svg>;
    case 'star':     return <svg {...props}><path d="M12 3l2.6 5.6 6 .6-4.5 4.2 1.3 6L12 16.6 6.6 19.4l1.3-6L3.4 9.2l6-.6L12 3z"/></svg>;
    case 'star-fill':return <svg {...props} fill="currentColor"><path d="M12 3l2.6 5.6 6 .6-4.5 4.2 1.3 6L12 16.6 6.6 19.4l1.3-6L3.4 9.2l6-.6L12 3z"/></svg>;
    case 'moon':     return <svg {...props}><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>;
    case 'send':     return <svg {...props}><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg>;

function Avatar({ name, size = 36, radius = 12 }) {

<script type="text/babel">
/* global React, Icon, Avatar */
const { useState: useS, useEffect: useE, useRef: useR } = React;

function InboxList({ emails, selectedId, onSelect, filter, setFilter, onOpenSearch, wide }) {
  const counts = {
    all: emails.length,
    unread: emails.filter(e => e.unread).length,
    starred: emails.filter(e => e.starred).length,
  };

  const filtered = emails.filter(e => {
    if (filter === 'unread') return e.unread;
    if (filter === 'starred') return e.starred;
    if (filter === 'work' || filter === 'personal' || filter === 'reading' || filter === 'finance' || filter === 'travel') {
      return e.labels.includes(filter);
    }
    return true;
  });

  const groups = [];
  const seen = {};
  filtered.forEach(e => {
    if (!seen[e.date]) { seen[e.date] = []; groups.push({ label: e.date, items: seen[e.date] }); }
    seen[e.date].push(e);
  });

  const labelFor = d => ({today: 'Today', yesterday: 'Yesterday', 'this week': 'This week', earlier: 'Earlier'}[d] || d);

  return (
    <section className="panel list-panel">
      <div className="list-header">
        <div className="list-title-row">
          <div className="list-title">Inbox</div>
          <div className="list-count">{counts.unread} unread</div>
        </div>
        <div className="search-box" onClick={onOpenSearch}>
          <Icon name="search" size={15}/>
          Search mail, people, files…
          <span className="kbd">⌘K</span>
        </div>
      </div>

      <div className="filter-chips">
        {[
          { id: 'all', label: 'All', count: counts.all },
          { id: 'unread', label: 'Unread', count: counts.unread },
          { id: 'starred', label: 'Starred', count: counts.starred },
          { id: 'work', label: 'Work' },
          { id: 'personal', label: 'Personal' },
          { id: 'reading', label: 'Reading' },
          { id: 'finance', label: 'Finance' },
        ].map(c => (
          <button
            key={c.id}
            className={`chip ${filter === c.id ? 'active' : ''}`}
            onClick={() => setFilter(c.id)}
          >
            {c.label}
            {c.count != null && <span className="chip-count">{c.count}</span>}
          </button>
        ))}
      </div>

      <div className="list-scroll">
        {groups.map(g => (
          <div key={g.label} className="email-group">
            <div className="email-group-label">{labelFor(g.label)}</div>
            {g.items.map(e => (
              <EmailRow
                key={e.id}
                email={e}
                selected={selectedId === e.id}
                onClick={() => onSelect(e.id)}
                wide={wide}
              />
            ))}
          </div>
        ))}
        {filtered.length === 0 && (
          <div style={{padding: '40px 20px', textAlign: 'center', color: 'var(--ink-3)', fontSize: 13}}>
            No mail matches this filter.
          </div>
        )}
      </div>
    </section>
  );
}

function EmailRow({ email, selected, onClick, wide }) {
  if (wide) {
    return (
      <div className={`email-row ${selected ? 'active' : ''} ${email.unread ? 'unread' : ''}`} onClick={onClick}>
        <Avatar name={email.from} size={44} radius={14}/>
        <div className="email-from-col">
          <span className="email-from">{email.from}</span>
          <span className="email-handle">{email.fromEmail}</span>
        </div>
        <div className="email-body">
          <span className="email-subject">{email.subject}</span>
          <span className="email-preview">— {email.preview}</span>
        </div>
        <div className="email-meta">
          {email.labels.length > 0 && (() => {
            const lbl = window.LABELS[email.labels[0]];
            return lbl ? (
              <span className="tag-pill" style={{ background: `${lbl.color}1F`, color: lbl.color }}>
                {lbl.name}
              </span>
            ) : null;
          })()}
          {email.attachments.length > 0 && <Icon name="paperclip" size={13}/>}
          {email.starred && <span style={{color: '#E8B355'}}><Icon name="star-fill" size={13}/></span>}
          <span className="time">{email.time}</span>
        </div>
      </div>
    );
  }
  return (
    <div className={`email-row ${selected ? 'active' : ''} ${email.unread ? 'unread' : ''}`} onClick={onClick}>
      <Avatar name={email.from} size={36} radius={12}/>
      <div className="email-body">
        <div className="email-row-top">
          <span className="email-from">{email.from}</span>
        </div>
        <div className="email-subject">{email.subject}</div>
        <div className="email-preview">{email.preview}</div>
        {email.labels.length > 0 && (
          <div className="email-tags">
            {email.labels.slice(0, 2).map(l => {
              const lbl = window.LABELS[l];
              if (!lbl) return null;
              return (
                <span key={l} className="tag-pill" style={{ background: `${lbl.color}1F`, color: lbl.color }}>
                  {lbl.name}
                </span>
              );
            })}
          </div>
        )}
      </div>
      <div className="email-meta">
        <span className="time">{email.time}</span>
        <div style={{display: 'flex', gap: 4, alignItems: 'center'}}>
          {email.attachments.length > 0 && <Icon name="paperclip" size={13}/>}
          {email.starred && <span style={{color: '#E8B355'}}><Icon name="star-fill" size={13}/></span>}
        </div>
      </div>
    </div>
  );
}
window.InboxList = InboxList;

function Reader({ email, onClose, onArchive }) {
  if (!email) {
    return (
      <section className="panel">
        <div className="empty">
          <div className="empty-inner">
            <div className="empty-illus">
              <div className="cloud-1"></div>
              <div className="cloud-2"></div>
              <div className="cloud-3"></div>
            </div>
            <div className="empty-title">A quiet inbox is a good inbox</div>
            <div className="empty-sub">Pick a message from the list to read it here, or start something new.</div>
          </div>
        </div>
      </section>
    );
  }
  return (
    <section className="panel reader-panel">
      <div className="reader-toolbar">
        <button className="icon-btn" title="Back" onClick={onClose}><Icon name="corner-up-left" size={17}/></button>
        <div className="toolbar-divider"></div>
        <button className="icon-btn" title="Archive" onClick={onArchive}><Icon name="archive" size={17}/></button>
        <button className="icon-btn" title="Snooze"><Icon name="moon" size={17}/></button>
        <button className="icon-btn danger" title="Trash"><Icon name="trash" size={17}/></button>
        <div className="toolbar-divider"></div>
        <button className="icon-btn" title="Label"><Icon name="tag" size={17}/></button>
        <button className="icon-btn" title="Mark unread"><Icon name="mail" size={17}/></button>
        <div className="toolbar-right">
          <button className="icon-btn" title="Reply"><Icon name="reply" size={17}/></button>
          <button className="icon-btn" title="Reply all"><Icon name="reply-all" size={17}/></button>
          <button className="icon-btn" title="Forward"><Icon name="forward" size={17}/></button>
          <div className="toolbar-divider"></div>
          <button className="icon-btn" title="More"><Icon name="more" size={17}/></button>
        </div>
      </div>

      <div className="reader-scroll">
        <div className="reader-inner">
          <h1 className="reader-subject">{email.subject}</h1>

          {email.labels.length > 0 && (
            <div className="reader-labels">
              {email.labels.map(l => {
                const lbl = window.LABELS[l];
                if (!lbl) return null;
                return (
                  <span key={l} className="tag-pill" style={{ background: `${lbl.color}1F`, color: lbl.color }}>
                    {lbl.name}
                  </span>
                );
              })}
            </div>
          )}

          <div className="reader-sender">
            <Avatar name={email.from} size={44} radius={14}/>
            <div className="reader-sender-meta">
              <div className="from">{email.from} <span style={{color: 'var(--ink-3)', fontWeight: 500, fontSize: 13}}>&lt;{email.fromEmail}&gt;</span></div>
              <div className="to">to me · {email.time === '9:42' ? 'just now' : email.time}</div>
            </div>
            <div className="reader-sender-time">{email.date === 'today' ? 'Today' : email.date === 'yesterday' ? 'Yesterday' : email.time}, {email.time === '9:42' ? '9:42 AM' : '2026'}</div>
          </div>

          {email.summary && (
            <div className="reader-summary">
              <div className="summary-label">
                <Icon name="sparkle" size={12}/> AI summary
              </div>
              <div className="summary-text">{email.summary}</div>
              <div className="summary-actions">
                <span className="summary-action">Extract tasks</span>
                <span className="summary-action">Suggest a reply</span>
                <span className="summary-action">Find related</span>
              </div>
            </div>
          )}

          <div className="reader-body">
            {email.body.map((p, i) => (
              <p key={i} style={p.includes('•') ? {whiteSpace: 'pre-line'} : {}}>{p}</p>
            ))}
            {email.attachments.length > 0 && (
              <div className="attachment-row">
                {email.attachments.map((a, i) => (
                  <div key={i} className="attachment">
                    <div className="attachment-thumb" style={{ background: a.color }}>
                      {a.kind.toUpperCase()}
                    </div>
                    <div className="attachment-meta">
                      <div className="attachment-name">{a.name}</div>
                      <div className="attachment-size">{a.size}</div>
                    </div>
                  </div>
                ))}
              </div>
            )}
            {email.sig && <div className="sig" style={{whiteSpace: 'pre-line'}}>{email.sig}</div>}
          </div>

          {email.quickReplies && email.quickReplies.length > 0 && (
            <div className="quick-reply">
              <div className="quick-reply-label">
                <span style={{display: 'inline-flex', alignItems: 'center', gap: 5, color: 'var(--lavender)'}}>
                  <Icon name="sparkle" size={11}/> Suggested replies
                </span>
              </div>
              <div className="quick-reply-options">
                {email.quickReplies.map((q, i) => (
                  <button key={i} className="quick-reply-option">{q}</button>
                ))}
              </div>
              <div className="reply-bar">
                <input placeholder={`Reply to ${email.from.split(' ')[0]}…`}/>
                <button className="icon-btn" title="Attach"><Icon name="paperclip" size={16}/></button>
                <button className="icon-btn" title="Emoji"><Icon name="smile" size={16}/></button>
                <button className="reply-send"><Icon name="send" size={14}/></button>
              </div>
            </div>
          )}
        </div>
      </div>
    </section>
  );
}
window.Reader = Reader;
</script>
<script type="text/babel">
/* global React, Icon, Avatar */

function Compose({ onClose }) {
  const [to, setTo] = React.useState([{ name: 'Maya Okafor', email: 'maya@northwindstudio.co' }]);
  const [showCc, setShowCc] = React.useState(false);
  const [subject, setSubject] = React.useState('Re: Friday review — moodboards are ready');
  const [body, setBody] = React.useState('');
  const placeholder = `Hi Maya,\n\n`;

  return (
    <div className="compose-backdrop" onClick={onClose}>
      <div className="compose-window" onClick={e => e.stopPropagation()}>

            <button className="icon-btn" title="Close" onClick={onClose}><Icon name="close" size={16}/></button>
          </div>

        <div className="compose-field">
          <label>To</label>

              <span key={i} className="recipient-chip">

              </span>
            ))}
            <input
              style={{minWidth: 60, flex: 1, padding: '2px 0'}}
              placeholder="Add recipient…"
            />
          </div>
          {!showCc && (
            <button className="btn-ghost" style={{padding: '4px 8px', fontSize: 12, color: 'var(--ink-3)'}} onClick={() => setShowCc(true)}>Cc / Bcc</button>
          )}
        </div>

        {showCc && (
          <React.Fragment>
            <div className="compose-field">
              <label>Cc</label>
              <input placeholder="cc@example.com"/>
            </div>
            <div className="compose-field">
              <label>Bcc</label>
              <input placeholder="bcc@example.com"/>
            </div>
          </React.Fragment>
        )}

        <div className="compose-field">
          <label>Subject</label>
          <input value={subject} onChange={e => setSubject(e.target.value)} placeholder="What is this about?"/>
        </div>

        <div className="compose-body">
          <textarea
            value={body}

function SearchOverlay({ onClose, onSelect }) {
  const [q, setQ] = React.useState('moodboard');
  const inputRef = React.useRef(null);
  React.useEffect(() => { inputRef.current?.focus(); }, []);

  React.useEffect(() => {
    const h = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, [onClose]);

  const results = window.EMAILS.filter(e =>
    !q || e.subject.toLowerCase().includes(q.toLowerCase()) ||
    e.preview.toLowerCase().includes(q.toLowerCase()) ||
    e.from.toLowerCase().includes(q.toLowerCase())
  );

  const highlight = (text) => {
    if (!q) return text;
    const idx = text.toLowerCase().indexOf(q.toLowerCase());
    if (idx === -1) return text;
    return <React.Fragment>{text.slice(0, idx)}<mark>{text.slice(idx, idx + q.length)}</mark>{text.slice(idx + q.length)}</React.Fragment>;
  };

  return (
    <div className="search-overlay" onClick={onClose}>
      <div className="search-modal" onClick={e => e.stopPropagation()}>
        <div className="search-input-row">
          <Icon name="search" size={18}/>
          <input
            ref={inputRef}
            value={q}
            onChange={e => setQ(e.target.value)}
            placeholder="Search mail, people, files…"
          />
          <button className="icon-btn" onClick={onClose}><Icon name="close" size={16}/></button>
        </div>

        <div className="search-filters">
          <button className="chip active">Any</button>
          <button className="chip"><Icon name="paperclip" size={11}/> Has files</button>
          <button className="chip"><Icon name="star" size={11}/> Starred</button>
          <button className="chip">From: anyone</button>
          <button className="chip">Last 30 days</button>
        </div>

        {results.length > 0 && (
          <div className="search-section">
            <div className="search-section-label">Messages — {results.length}</div>
            {results.slice(0, 5).map((e, i) => (
              <div key={e.id} className={`search-result ${i === 0 ? 'selected' : ''}`}
                   onClick={() => { onSelect(e.id); onClose(); }}>
                <Avatar name={e.from} size={32} radius={10}/>
                <div className="search-result-text">
                  <div className="search-result-subject">{highlight(e.subject)}</div>
                  <div className="search-result-preview">{e.from} · {highlight(e.preview.slice(0, 80))}…</div>
                </div>
                <div className="search-result-time">{e.time}</div>
              </div>
            ))}
          </div>
        )}

        {results.length === 0 && (
          <div className="search-section">
            <div style={{padding: '40px 20px', textAlign: 'center', color: 'var(--ink-3)', fontSize: 13}}>
              No matches for "{q}"
            </div>
          </div>
        )}

        <div className="search-footer">
          <span><span className="kbd">↑</span><span className="kbd">↓</span> navigate</span>
          <span><span className="kbd">↵</span> open</span>
          <span><span className="kbd">esc</span> close</span>
          <span style={{marginLeft: 'auto'}}>Powered by CloudMail Search</span>
        </div>
      </div>
    </div>
  );
}
window.SearchOverlay = SearchOverlay;

<script type="text/babel">
/* global React, ReactDOM, Sidebar, InboxList, Reader, Compose, SearchOverlay, Settings, Login */
const { useState, useEffect } = React;
const { TweaksPanel, TweakSection, TweakRadio, TweakToggle } = window;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "light",
  "showSwitcher": true
}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweak] = window.useTweaks(TWEAK_DEFAULTS);

  const [authed, setAuthed] = useState(true);
  const [view, setView] = useState('inbox');
  const [folder, setFolder] = useState('inbox');
  const [filter, setFilter] = useState('all');
  const [selectedId, setSelectedId] = useState(null);
  const [composeOpen, setComposeOpen] = useState(false);
  const [searchOpen, setSearchOpen] = useState(false);

  useEffect(() => {
    const theme = tweaks.theme;
    let resolved = theme;
    if (theme === 'auto') {
      resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', resolved);
  }, [tweaks.theme]);

  useEffect(() => {
    const h = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault(); setSearchOpen(s => !s);
      } else if (e.key === 'c' && !composeOpen && !searchOpen && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
        setComposeOpen(true);
      } else if (e.key === 'Escape') {
        if (composeOpen) setComposeOpen(false);
      }
    };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, [composeOpen, searchOpen]);

  const emails = window.EMAILS;
  const selected = emails.find(e => e.id === selectedId);

  const screenLabel =
    view === 'login' ? '05 Sign in' :
    view === 'settings' ? '04 Settings' :
    composeOpen ? '02 Compose' :
    searchOpen ? '03 Search' : '01 Inbox';

  return (
    <React.Fragment>
    {view === 'login' ? (
      <div data-screen-label={screenLabel}><Login onEnter={() => setView('inbox')}/></div>
    ) : (
    <div className="app" data-screen-label={screenLabel}>
      <Sidebar
        currentFolder={folder}
        onFolderChange={setFolder}
        onCompose={() => setComposeOpen(true)}
        onView={setView}
        currentView={view}
      />

      {view === 'inbox' && (
        <div className={`main ${selected ? 'main-reader' : 'main-list'}`}>
          {!selected && (
            <InboxList
              emails={emails}
              selectedId={selectedId}
              wide={true}
              onSelect={(id) => {
                setSelectedId(id);
                const e = window.EMAILS.find(e => e.id === id);
                if (e) e.unread = false;
              }}
              filter={filter}
              setFilter={setFilter}
              onOpenSearch={() => setSearchOpen(true)}
            />
          )}
          {selected && (
            <Reader
              email={selected}
              onClose={() => setSelectedId(null)}
              onArchive={() => setSelectedId(null)}
            />
          )}
        </div>
      )}

      {view === 'settings' && (
        <Settings theme={tweaks.theme} onThemeChange={(v) => setTweak('theme', v)}/>
      )}

      {composeOpen && <Compose onClose={() => setComposeOpen(false)}/>}
      {searchOpen && <SearchOverlay onClose={() => setSearchOpen(false)} onSelect={setSelectedId}/>}
    </div>
    )}

      <TweaksPanel title="Tweaks">
        <TweakSection title="Theme">
          <TweakRadio
            value={tweaks.theme}
            onChange={(v) => setTweak('theme', v)}
            options={[
              { value: 'light', label: 'Light' },
              { value: 'dark',  label: 'Dark' },
              { value: 'auto',  label: 'Auto' },
            ]}
          />
        </TweakSection>
        <TweakSection title="View">
          <TweakToggle
            label="Show screen switcher"
            value={tweaks.showSwitcher}
            onChange={(v) => setTweak('showSwitcher', v)}
          />
        </TweakSection>
      </TweaksPanel>

      {tweaks.showSwitcher && <div className="viewport-switcher">
        <button className={view === 'inbox' && !composeOpen && !searchOpen ? 'active' : ''}
                onClick={() => { setView('inbox'); setComposeOpen(false); setSearchOpen(false); }}>Inbox</button>
        <button className={composeOpen ? 'active' : ''}
                onClick={() => { setView('inbox'); setComposeOpen(true); setSearchOpen(false); }}>Compose</button>
        <button className={searchOpen ? 'active' : ''}
                onClick={() => { setView('inbox'); setSearchOpen(true); setComposeOpen(false); }}>Search</button>
        <button className={view === 'settings' ? 'active' : ''}
                onClick={() => { setView('settings'); setComposeOpen(false); setSearchOpen(false); }}>Settings</button>
        <button className={view === 'login' ? 'active' : ''}
                onClick={() => { setView('login'); setComposeOpen(false); setSearchOpen(false); }}>Sign in</button>
      </div>}
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
